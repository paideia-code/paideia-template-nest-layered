name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validar aplicación
    uses: paideia-code/paideia-infra-automations/.github/workflows/node-npm-jest-ci.yml@v0.9.0
    with:
      run-integration-tests: true

  build-image:
    name: Construir imagen para ECR
    needs: validate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: paideia-code/paideia-infra-automations/.github/workflows/docker-build-publish-ecr.yml@v0.9.0
    secrets: inherit

  publish-ghcr:
    name: Publicar versión en GHCR
    needs: validate
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
      packages: write
    uses: paideia-code/paideia-infra-automations/.github/workflows/docker-build-publish-ghcr.yml@v1.0.0-rc.1
    with:
      version: ${{ github.ref_name }}
