name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validar aplicación
    uses: paideia-code/paideia-infra-automations/.github/workflows/ci-node-npm.yml@v0.2.0
    with:
      run-integration-tests: true

  build-image:
    name: Construir imagen
    needs: validate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: paideia-code/paideia-infra-automations/.github/workflows/build-image-docker.yml@v0.5.0
    secrets: inherit
